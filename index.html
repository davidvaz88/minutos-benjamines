
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10243a">
<title>Minutos Benjamines</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #edf2f7;
  color: #172536;
}
header {
  background: #10243a;
  color: white;
  padding: 18px;
  text-align: center;
}
h1 { margin: 0; font-size: 23px; }
main { max-width: 850px; margin: auto; padding: 14px; }
.panel {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px #0000000d;
}
.reloj {
  font-size: 48px;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.estado { text-align: center; font-weight: 700; }
.ayuda { color: #536579; font-size: 14px; }
.botones { display: flex; flex-wrap: wrap; gap: 9px; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 12px 15px;
  background: #1766d1;
  color: white;
  font-weight: 700;
  font-size: 15px;
}
button:disabled { opacity: .4; cursor: not-allowed; }
button.sec { background: #566678; }
button.danger { background: #b52c36; }
button.success { background: #168050; }
.jugadores {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
}
.jugador {
  text-align: left;
  background: #e9eef5;
  color: #172536;
  border: 2px solid transparent;
  min-height: 105px;
}
.jugador.campo {
  background: #d6f4e2;
  border-color: #168050;
}
.jugador.seleccionado {
  background: #dceafe;
  border-color: #1766d1;
}
.nombre { display: block; font-size: 17px; }
.minutos { display: block; margin-top: 7px; }
.situacion { display: block; font-size: 12px; margin-top: 5px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 9px 5px; border-bottom: 1px solid #ddd; text-align: left; }
td:not(:first-child), th:not(:first-child) { text-align: right; }
@media (min-width: 650px) {
  .jugadores { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<header>
  <h1>⚽ Minutos Benjamines</h1>
</header>

<main>
  <section class="panel">
    <div id="reloj" class="reloj">00:00</div>
    <p id="estado" class="estado">PREPARAR PRIMERA PARTE</p>
    <p id="indicaciones" class="ayuda">
      Selecciona exactamente 8 titulares.
    </p>
    <div class="botones">
      <button id="iniciar" onclick="iniciarParte()">
        Iniciar primera parte
      </button>
      <button id="terminar" class="danger"
        onclick="terminarParte()" disabled>
        Terminar parte
      </button>
      <button class="sec" onclick="deshacer()">
        Deshacer cambio
      </button>
    </div>
  </section>

  <section class="panel">
    <h2 id="tituloJugadores">Titulares: 0/8</h2>
    <div id="jugadores" class="jugadores"></div>
  </section>

  <section class="panel">
    <h2>Minutos acumulados</h2>
    <table>
      <thead>
        <tr>
          <th>Jugador</th>
          <th>1.ª</th>
          <th>2.ª</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="resumen"></tbody>
    </table>
    <br>
    <div class="botones">
      <button class="success" onclick="exportarCSV()">
        Exportar Excel (CSV)
      </button>
      <button class="danger" onclick="reiniciar()">
        Nuevo partido
      </button>
    </div>
  </section>
</main>

<script>
"use strict";

const plantilla = [
  [1, "Mauro"],
  [3, "Javi"],
  [4, "Elías"],
  [5, "Brais"],
  [6, "Xabi"],
  [7, "Roque"],
  [8, "Leo Estévez"],
  [9, "Thiago"],
  [10, "Enzo"],
  [11, "Angelo"],
  [12, "Xes"],
  [14, "Leo Mendes"]
];

const CLAVE = "benjamines_v4";
const DURACION = 25 * 60;

function estadoNuevo() {
  return {
    fase: "pre1",
    parte: 1,
    seleccion: [],
    segundos: 0,
    actualizado: null,
    jugadores: plantilla.map(([dorsal, nombre]) => ({
      dorsal,
      nombre,
      campo: false,
      tiempos: [0, 0]
    }))
  };
}

let datos = estadoNuevo();
let historial = [];

try {
  const guardado = localStorage.getItem(CLAVE);
  if (guardado) {
    const recuperado = JSON.parse(guardado);
    if (
      recuperado &&
      Array.isArray(recuperado.jugadores) &&
      recuperado.jugadores.length === plantilla.length
    ) {
      datos = recuperado;
    }
  }
} catch (e) {
  console.warn("No se pudo recuperar el partido", e);
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(datos));
  } catch (e) {
    console.warn("No se pudo guardar", e);
  }
}

function copiarEstado() {
  return JSON.parse(JSON.stringify(datos));
}

function registrarCambio() {
  historial.push(copiarEstado());
  if (historial.length > 30) historial.shift();
}

function avanzarTiempo() {
  if (datos.fase !== "jugando") return;

  const ahora = Date.now();
  const anterior = datos.actualizado || ahora;
  const transcurrido = Math.max(0, (ahora - anterior) / 1000);
  const restante = Math.max(0, DURACION - datos.segundos);
  const incremento = Math.min(transcurrido, restante);

  datos.segundos += incremento;
  datos.actualizado = ahora;

  for (const jugador of datos.jugadores) {
    if (jugador.campo) {
      jugador.tiempos[datos.parte - 1] += incremento;
    }
  }

  if (datos.segundos >= DURACION) {
    finalizarParte();
  }
}

function formatoReloj(segundos) {
  const s = Math.floor(segundos);
  const m = Math.floor(s / 60);
  return String(m).padStart(2, "0") + ":" +
    String(s % 60).padStart(2, "0");
}

function formatoMinutos(segundos) {
  return (segundos / 60).toFixed(1).replace(".", ",");
}

function pulsarJugador(dorsal) {
  avanzarTiempo();

  const jugador = datos.jugadores.find(
    j => j.dorsal === dorsal
  );
  if (!jugador) return;

  if (datos.fase === "pre1" || datos.fase === "descanso") {
    const posicion = datos.seleccion.indexOf(dorsal);

    if (posicion >= 0) {
      datos.seleccion.splice(posicion, 1);
    } else {
      if (datos.seleccion.length >= 8) {
        alert("Solo puedes seleccionar 8 titulares.");
        return;
      }
      datos.seleccion.push(dorsal);
    }
  } else if (datos.fase === "jugando") {
    registrarCambio();

    if (jugador.campo) {
      jugador.campo = false;
    } else {
      const enCampo = datos.jugadores.filter(j => j.campo).length;
      if (enCampo >= 8) {
        alert("Primero debes sacar a un jugador.");
        return;
      }
      jugador.campo = true;
    }
  } else {
    return;
  }

  guardar();
  pintar();
}

function iniciarParte() {
  avanzarTiempo();

  if (
    datos.fase !== "pre1" &&
    datos.fase !== "descanso"
  ) return;

  if (datos.seleccion.length !== 8) {
    alert("Selecciona exactamente 8 titulares.");
    return;
  }

  registrarCambio();

  datos.parte = datos.fase === "pre1" ? 1 : 2;
  datos.segundos = 0;
  datos.fase = "jugando";
  datos.actualizado = Date.now();

  for (const j of datos.jugadores) {
    j.campo = datos.seleccion.includes(j.dorsal);
  }

  datos.seleccion = [];
  guardar();
  pintar();
}

function finalizarParte() {
  if (datos.fase !== "jugando") return;

  datos.actualizado = null;

  for (const j of datos.jugadores) {
    j.campo = false;
  }

  datos.seleccion = [];
  datos.fase = datos.parte === 1 ? "descanso" : "final";
  guardar();
}

function terminarParte() {
  if (datos.fase !== "jugando") return;

  avanzarTiempo();

  if (datos.fase !== "jugando") {
    pintar();
    return;
  }

  registrarCambio();
  finalizarParte();
  pintar();
}

function deshacer() {
  if (historial.length === 0) {
    alert("No hay cambios para deshacer.");
    return;
  }

  avanzarTiempo();
  const anterior = historial.pop();

  if (anterior.fase === "jugando") {
    // No recuperar el tiempo del reloj hacia atrás.
    // Solo restaurar quién estaba en el campo.
    if (datos.fase === "jugando" &&
        anterior.parte === datos.parte) {
      datos.jugadores.forEach((j, i) => {
        j.campo = anterior.jugadores[i].campo;
      });
    } else {
      alert("No se puede deshacer el inicio de una parte.");
      return;
    }
  } else {
    datos = anterior;
  }

  guardar();
  pintar();
}

function reiniciar() {
  if (!confirm("¿Borrar el partido actual y empezar uno nuevo?")) {
    return;
  }

  datos = estadoNuevo();
  historial = [];
  guardar();
  pintar();
}

function exportarCSV() {
  avanzarTiempo();

  const filas = [
    ["Dorsal", "Nombre", "Primera parte",
     "Segunda parte", "Total"]
  ];

  for (const j of datos.jugadores) {
    filas.push([
      j.dorsal,
      j.nombre,
      formatoMinutos(j.tiempos[0]),
      formatoMinutos(j.tiempos[1]),
      formatoMinutos(j.tiempos[0] + j.tiempos[1])
    ]);
  }

  const contenido = "\uFEFF" + filas
    .map(fila => fila.join(";"))
    .join("\r\n");

  const blob = new Blob([contenido], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = "minutos-benjamines.csv";
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function pintar() {
  const reloj = document.getElementById("reloj");
  const estado = document.getElementById("estado");
  const indicaciones = document.getElementById("indicaciones");
  const iniciar = document.getElementById("iniciar");
  const terminar = document.getElementById("terminar");
  const titulo = document.getElementById("tituloJugadores");
  const contenedor = document.getElementById("jugadores");
  const resumen = document.getElementById("resumen");

  const tiempoVisible = datos.parte === 2
    ? DURACION + datos.segundos
    : datos.segundos;

  reloj.textContent = formatoReloj(tiempoVisible);

  const jugando = datos.fase === "jugando";
  const preparando = datos.fase === "pre1" ||
    datos.fase === "descanso";

  iniciar.style.display = preparando ? "" : "none";
  terminar.style.display = jugando ? "" : "none";
  terminar.disabled = !jugando;

  if (datos.fase === "pre1") {
    estado.textContent = "PREPARAR PRIMERA PARTE";
    iniciar.textContent = "Iniciar primera parte";
  } else if (datos.fase === "jugando") {
    estado.textContent = datos.parte === 1
      ? "PRIMERA PARTE EN JUEGO"
      : "SEGUNDA PARTE EN JUEGO";
    terminar.textContent = datos.parte === 1
      ? "Terminar 1.ª parte"
      : "Finalizar partido";
  } else if (datos.fase === "descanso") {
    estado.textContent = "DESCANSO · RELOJ PARADO";
    iniciar.textContent = "Iniciar segunda parte";
  } else {
    estado.textContent = "PARTIDO FINALIZADO";
  }

  indicaciones.textContent = preparando
    ? "Selecciona 8 titulares antes de iniciar."
    : jugando
      ? "Toca un jugador para sacarlo o meterlo. Primero saca y después mete."
      : "Puedes exportar los minutos o empezar otro partido.";

  const enCampo = datos.jugadores.filter(j => j.campo).length;

  titulo.textContent = preparando
    ? "Titulares: " + datos.seleccion.length + "/8"
    : "Jugadores en campo: " + enCampo + "/8";

  contenedor.innerHTML = "";

  for (const j of datos.jugadores) {
    const seleccionado = datos.seleccion.includes(j.dorsal);

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "jugador" +
      (jugando && j.campo ? " campo" : "") +
      (preparando && seleccionado ? " seleccionado" : "");

    const nombre = document.createElement("span");
    nombre.className = "nombre";
    nombre.textContent = j.dorsal + " · " + j.nombre;

    const minutos = document.createElement("span");
    minutos.className = "minutos";
    minutos.textContent = formatoMinutos(
      j.tiempos[0] + j.tiempos[1]
    ) + " min";

    const situacion = document.createElement("span");
    situacion.className = "situacion";
    situacion.textContent = jugando
      ? (j.campo ? "🟢 EN CAMPO · Tocar para salir"
                 : "⚪ BANQUILLO · Tocar para entrar")
      : preparando
        ? (seleccionado ? "✓ TITULAR" : "Tocar para seleccionar")
        : "Minutos registrados";

    boton.append(nombre, minutos, situacion);
    boton.disabled = datos.fase === "final";
    boton.onclick = () => pulsarJugador(j.dorsal);
    contenedor.appendChild(boton);
  }

  resumen.innerHTML = "";

  for (const j of datos.jugadores) {
    const fila = document.createElement("tr");

    const valores = [
      j.dorsal + " · " + j.nombre,
      formatoMinutos(j.tiempos[0]),
      formatoMinutos(j.tiempos[1]),
      formatoMinutos(j.tiempos[0] + j.tiempos[1])
    ];

    for (const valor of valores) {
      const celda = document.createElement("td");
      celda.textContent = valor;
      fila.appendChild(celda);
    }

    resumen.appendChild(fila);
  }
}

// Recuperar el tiempo transcurrido si Safari estuvo cerrado.
avanzarTiempo();
pintar();

// Actualización periódica del cronómetro.
setInterval(() => {
  if (datos.fase === "jugando") {
    avanzarTiempo();
    guardar();
    pintar();
  }
}, 250);

// Actualizar cuando se vuelve a abrir la aplicación.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    avanzarTiempo();
    guardar();
    pintar();
  }
});
</script>
</body>
</html>
