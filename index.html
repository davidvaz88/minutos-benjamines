
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142948">
<title>Benxamín C · U.D. Santa Mariña</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f7;color:#172b43;font:13px system-ui,-apple-system,Arial,sans-serif}
header{background:#142948;color:white;padding:7px 10px;display:flex;align-items:center;justify-content:center;gap:9px}
header img{width:36px;height:40px;object-fit:contain}
header h1{font-size:15px;margin:0}
header small{font-size:10px}
main{max-width:1120px;margin:auto;padding:6px}
.panel{background:white;border-radius:10px;padding:9px;margin-bottom:6px;box-shadow:0 1px 4px #0001}
h2{font-size:14px;margin:0 0 6px}
button{border:0;border-radius:7px;padding:8px 6px;background:#285da8;color:white;font-size:12px;font-weight:750;min-height:37px;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.4}
.green{background:#167c4b}.red{background:#b13146}.grey{background:#63758c}
input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#172b43;font-size:14px}
label{display:block;margin:5px 0;font-size:12px;font-weight:650}
.row{display:flex;gap:5px;flex-wrap:wrap}
.muted{font-size:11px;color:#586b80;margin:5px 0}
[hidden]{display:none!important}
details>summary{cursor:pointer;font-weight:750}
.matchbar{display:grid;grid-template-columns:1fr;gap:5px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.top .panel{margin-bottom:0;padding:8px}
.clock{font-size:clamp(27px,7vw,42px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center}
.phase{font-size:11px;font-weight:750;text-align:center;margin:3px 0}
.top .muted{text-align:center}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3px;text-align:center}
.score>div{background:#eef2f7;border-radius:7px;padding:4px 2px}
.score .team{font-size:10px;min-height:27px;overflow-wrap:anywhere}
.score strong{font-size:27px;display:block}
.scorebuttons{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.scorebuttons button{font-size:10px;min-height:34px;padding:5px 2px}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.player{min-width:0;background:#edf2f8;border:2px solid transparent;border-radius:9px;padding:7px}
.player.on{background:#def7e8;border-color:#16804c}
.player.chosen{background:#dfebff;border-color:#285da8}
.player-head{display:flex;align-items:center;justify-content:space-between;gap:2px}
.player h3{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{font-size:10px;white-space:nowrap}
.ptimer{text-align:center;font-size:clamp(22px,6vw,30px);font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0}
.player.on .ptimer{color:#137a45}
.action{width:100%;min-height:40px;font-size:13px}
.statsline{display:flex;justify-content:center;gap:11px;font-size:11px;margin:7px 0 4px}
.more{margin-top:4px}
.more summary{font-size:11px;text-align:center;padding:6px;background:#dce4ef;border-radius:6px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.statbuttons{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.statbuttons button{font-size:11px;min-height:37px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
td,th{text-align:right;padding:7px 4px;border-bottom:1px solid #dce4ed;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
#authPanel{padding:7px 10px}
#authPanel summary{font-size:12px}
@media(max-width:370px){
 .top .panel{padding:5px}
 .top button{font-size:9px;min-height:32px;padding:4px 2px}
 .score strong{font-size:24px}
 .players{gap:4px}
 .player{padding:5px}
 .player h3{font-size:12px}
}
@media(min-width:650px){
 .players{grid-template-columns:repeat(4,minmax(0,1fr))}
 .matchbar{grid-template-columns:1fr 1fr}
 .top{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
<img src="escudo-ud-santa-marina.png" alt="Escudo" onerror="this.style.display='none'">
<div>
<h1>Benxamín C · U.D. Santa Mariña</h1>
<small>Minutos · Goles · Asistencias</small>
</div>
</header>

<main>

<details class="panel" id="authPanel">
<summary>☁️ <span id="sync">Comprobando Firebase…</span></summary>
<label>Correo electrónico</label>
<input id="email" type="email" autocomplete="username">
<label>Contraseña</label>
<input id="password" type="password" autocomplete="current-password">
<div class="row" style="margin-top:6px">
<button id="signIn">Entrar</button>
<button id="signUp" class="grey">Crear cuenta</button>
<button id="signOut" class="red" hidden>Cerrar sesión</button>
</div>
</details>

<section class="panel">
<h2>📅 Partido / entrenamiento</h2>
<select id="matches"></select>
<p id="matchInfo" class="muted"></p>

<div id="trainingCreate" hidden>
<label>Fecha</label>
<input id="trainDate" type="date">
<label>Nombre del entrenamiento</label>
<input id="trainName" placeholder="Entreno del jueves">
<label>Duración en minutos</label>
<input id="trainMinutes" type="number" min="1" max="180" value="30">
<label>Rival / equipos</label>
<input id="trainRival" placeholder="Rojo contra Azul">
<div class="row" style="margin-top:6px">
<button id="addTraining" class="green">Crear entrenamiento</button>
<button id="cancelTraining" class="grey">Cancelar</button>
</div>
</div>

<details id="matchSettings">
<summary style="font-size:11px;color:#586b80">⚙️ Rival y opciones</summary>
<label>Rival</label>
<input id="rival">
<button id="deleteTraining" class="red" hidden style="margin-top:7px">
🗑 Eliminar este entrenamiento
</button>
</details>
</section>

<div class="top">
<section class="panel">
<div class="clock" id="clock">00:00</div>
<div class="phase" id="phase">PREPARAR</div>
<p class="muted" id="hint">Selecciona 8 titulares</p>
<div class="row">
<button id="start" class="green">Iniciar</button>
<button id="finish" class="red" hidden>Terminar</button>
<button id="undo" class="grey">Deshacer</button>
</div>
</section>

<section class="panel">
<h2>⚽ Marcador</h2>
<div class="score">
<div>
<div class="team">Santa Mariña</div>
<strong id="ours">0</strong>
</div>
<b>–</b>
<div>
<div class="team" id="rivalTitle">Rival</div>
<strong id="theirs">0</strong>
</div>
</div>
<div class="muted" id="partials" style="text-align:center"></div>
<div class="scorebuttons">
<button id="ownPlus" class="green">+ Propio</button>
<button id="oppPlus">+ Rival</button>
<button id="ownMinus" class="red">− Propio</button>
<button id="oppMinus" class="grey">− Rival</button>
</div>
</section>
</div>

<section class="panel" style="margin-top:6px">
<h2 id="playersTitle">Titulares: 0/8</h2>
<div class="players" id="players"></div>
</section>

<details class="panel">
<summary>📊 Estadísticas completas / Excel</summary>
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Jugador</th><th>1.ª / Única</th><th>2.ª</th>
<th>Total</th><th>⚽</th><th>👟</th>
</tr>
</thead>
<tbody id="statsTable"></tbody>
</table>
</div>
<div class="row" style="margin-top:8px">
<button id="export" class="green">Exportar CSV</button>
<button id="reset" class="red">Reiniciar partido</button>
</div>
</details>

</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

/*
IMPORTANTE:
Pega la MISMA apiKey que ya te funciona
en tu aplicación actual.
*/

const firebaseConfig = {
 apiKey: "AIzaSyAY-ntSe4jskS8wkXdWDYjLSseeFVO2tsM",
 authDomain: "benxamin-c-santa-marina.firebaseapp.com",
 projectId: "benxamin-c-santa-marina",
 storageBucket: "benxamin-c-santa-marina.firebasestorage.app",
 messagingSenderId: "596374814925",
 appId: "1:596374814925:web:6c2cbac5f1a360a0f9a984"
};

const PEOPLE = [
 [1,"Mauro"],
 [3,"Javi"],
 [4,"Elías"],
 [5,"Brais"],
 [6,"Xabi"],
 [7,"Roque"],
 [8,"Leo Estévez"],
 [9,"Thiago"],
 [10,"Enzo"],
 [11,"Angelo"],
 [12,"Xes"],
 [14,"Leo Mendez"]
];

const GAMES = [
 {id:"j6",name:"Jornada 6 · CF San Esteban",date:"08/11/2026",rival:"CF San Esteban",type:"league"},
 {id:"j7",name:"Jornada 7 · Moledo C.F. B",date:"15/11/2026",rival:"Moledo C.F. B",type:"league"},
 {id:"j8",name:"Jornada 8 · C.D. Nieto A",date:"22/11/2026",rival:"C.D. Nieto A",type:"league"},
 {id:"j9",name:"Jornada 9 · Club Peñasco A",date:"29/11/2026",rival:"Club Peñasco A",type:"league"}
];

const KEY="santamarina_firebase_v1";
const MAX=8;
const $=id=>document.getElementById(id);
const sum=a=>(Number(a?.[0])||0)+(Number(a?.[1])||0);

let store={entrenamientos:[],partidos:{}};
let currentId="j6";
let data=null;
let history=[];
let auth=null,db=null,user=null,unsub=null;
let saveTimer=null;
let writeQueue=Promise.resolve();
let loading=false;
let changing=false;
const expandedPlayers=new Set();

try{
 const saved=JSON.parse(localStorage.getItem(KEY)||"null");
 if(saved&&saved.partidos)store=saved;
}catch(e){console.warn(e)}

function game(id){
 return [...GAMES,...store.entrenamientos].find(g=>g.id===id);
}

function isTraining(){
 const g=game(currentId);
 return g&&(g.type==="training"||g.tipo==="entreno");
}

function duration(){
 return isTraining()
  ?Math.max(60,Number(game(currentId).minutes||game(currentId).minutos||30)*60)
  :1500;
}

function fresh(g){
 return {
  phase:"pre1",half:0,sec:0,stamp:null,
  selected:[],
  rival:g.rival||"",
  score:{ours:[0,0],theirs:[0,0],unassigned:[0,0]},
  players:PEOPLE.map(([number,name])=>({
   number,name,on:false,
   time:[0,0],goals:[0,0],assists:[0,0]
  }))
 };
}

function pair(v){
 if(Array.isArray(v)){
  return [
   Math.max(0,Number(v[0])||0),
   Math.max(0,Number(v[1])||0)
  ];
 }
 return [Math.max(0,Number(v)||0),0];
}

/* Compatibilidad con los datos de versiones anteriores */
function normalize(raw,g){
 const base=fresh(g);
 if(!raw||typeof raw!=="object")return base;

 const phases={
  pre1:"pre1",playing:"playing",jugando:"playing",
  break:"break",descanso:"break",done:"done",final:"done"
 };
 base.phase=phases[raw.phase??raw.fase]||"pre1";
 base.half=Math.max(0,Math.min(1,Number(
  raw.half??(Number(raw.parte||1)-1)
 )||0));
 base.sec=Math.max(0,Number(raw.sec??raw.segundos)||0);
 base.stamp=raw.stamp??raw.actualizado??raw.ultima??raw.ultimaActualizacion??null;
 base.selected=Array.isArray(raw.selected??raw.seleccion)
  ?(raw.selected??raw.seleccion).map(Number):[];
 base.rival=raw.rival??g.rival??"";

 const score=raw.score??raw.marcador??{};
 base.score.ours=pair(score.ours??score.propios);
 base.score.theirs=pair(score.theirs??score.rivales);
 base.score.unassigned=pair(score.unassigned??score.sinAsignar);

 const oldPlayers=Array.isArray(raw.players)
  ?raw.players:Array.isArray(raw.jugadores)?raw.jugadores:[];

 for(const p of base.players){
  const old=oldPlayers.find(x=>
   Number(x.number??x.dorsal)===p.number
  );
  if(!old)continue;
  p.on=Boolean(old.on??old.campo);
  p.time=pair(old.time??old.tiempos);
  p.goals=pair(old.goals??old.goles);
  p.assists=pair(old.assists??old.asistencias);
 }
 return base;
}

function localSave(){
 if(!data)return;
 store.partidos[currentId]=data;
 try{
  localStorage.setItem(KEY,JSON.stringify(store));
 }catch(e){console.warn(e)}
}

function cloudRef(id){
 return db.collection("entrenadores").doc(user.uid)
  .collection("partidos").doc(id);
}

function persist(){
 localSave();
 if(!user||!db||loading)return;
 clearTimeout(saveTimer);
 const id=currentId;
 const copy=JSON.parse(JSON.stringify(data));
 $("sync").textContent="Guardando…";
 saveTimer=setTimeout(()=>{
  saveTimer=null;
  writeQueue=writeQueue.then(()=>
   cloudRef(id).set({
    data:copy,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   })
  ).then(()=>{
   $("sync").textContent="Conectado: "+user.email;
  }).catch(e=>{
   $("sync").textContent="Error: "+e.message;
  });
 },450);
}

function mmss(t){
 const n=Math.max(0,Math.floor(Number(t)||0));
 return String(Math.floor(n/60)).padStart(2,"0")
  +":"+String(n%60).padStart(2,"0");
}

function setup(){
 return data.phase==="pre1"||data.phase==="break";
}

function finishHalf(){
 data.stamp=null;
 data.players.forEach(p=>p.on=false);
 data.selected=[];
 data.phase=isTraining()||data.half===1?"done":"break";
 history=[];
 persist();
}

function advance(){
 if(!data||data.phase!=="playing")return;
 const now=Date.now();
 const delta=Math.max(0,(now-(Number(data.stamp)||now))/1000);
 const inc=Math.min(delta,Math.max(0,duration()-data.sec));
 data.sec+=inc;
 data.stamp=now;
 for(const p of data.players){
  if(p.on)p.time[data.half]+=inc;
 }
 if(data.sec>=duration())finishHalf();
}

function options(){
 const select=$("matches");
 select.replaceChildren();
 for(const g of [...GAMES,...store.entrenamientos]){
  select.add(new Option(g.name||g.nombre,g.id));
 }
 select.add(new Option("＋ Crear entrenamiento","new"));
 select.value=currentId;
}

function subscribe(){
 if(unsub){unsub();unsub=null}
 if(!user||!db)return;
 const id=currentId;
 unsub=cloudRef(id).onSnapshot(snap=>{
  if(id!==currentId||loading||!snap.exists)return;
  if(snap.metadata.hasPendingWrites||saveTimer)return;
  const raw=snap.data()?.data;
  if(!raw)return;
  data=normalize(raw,game(id));
  localSave();
  render();
 },e=>$("sync").textContent="Error: "+e.message);
}

async function choose(next){
 if(changing)return;
 changing=true;
 try{
  if(data){
   advance();
   localSave();
   if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer=null;
    if(user&&db){
     const oldId=currentId;
     const copy=JSON.parse(JSON.stringify(data));
     writeQueue=writeQueue.then(()=>
      cloudRef(oldId).set({data:copy})
     ).catch(console.warn);
    }
   }
   await writeQueue;
  }

  if(unsub){unsub();unsub=null}
  currentId=next;
  const g=game(next);
  if(!g)return;
  data=normalize(store.partidos[next],g);
  history=[];
  expandedPlayers.clear();

  if(user&&db){
   loading=true;
   try{
    const snap=await cloudRef(next).get();
    if(snap.exists&&snap.data()?.data){
     data=normalize(snap.data().data,g);
    }else{
     await cloudRef(next).set({data});
    }
   }catch(e){
    $("sync").textContent="Error de carga: "+e.message;
   }finally{loading=false}
  }

  advance();
  localSave();
  options();
  render();
  subscribe();
 }finally{
  changing=false;
 }
}

function person(n){
 return data.players.find(p=>p.number===n);
}

function toggle(n){
 advance();
 const p=person(n);
 if(setup()){
  const i=data.selected.indexOf(n);
  if(i>=0)data.selected.splice(i,1);
  else if(data.selected.length<MAX)data.selected.push(n);
  else return alert("Solo puedes seleccionar 8 titulares.");
 }else if(data.phase==="playing"){
  if(!p.on&&data.players.filter(x=>x.on).length>=MAX){
   return alert("Primero saca a un jugador.");
  }
  history.push(data.players.map(x=>x.on));
  p.on=!p.on;
 }else return;

 persist();
 render();
}

function start(){
 advance();
 if(!setup())return;
 if(data.selected.length!==8){
  return alert("Selecciona exactamente 8 titulares.");
 }
 data.half=data.phase==="break"?1:0;
 data.sec=0;
 data.stamp=Date.now();
 data.phase="playing";
 data.players.forEach(p=>p.on=data.selected.includes(p.number));
 data.selected=[];
 history=[];
 persist();
 render();
}

function finish(){
 advance();
 if(data.phase==="playing")finishHalf();
 render();
}

function undo(){
 advance();
 if(data.phase!=="playing"||!history.length){
  return alert("No hay ningún cambio que deshacer.");
 }
 const old=history.pop();
 data.players.forEach((p,i)=>p.on=old[i]);
 persist();
 render();
}

function stat(n,field,delta){
 advance();
 const p=person(n),half=data.half;
 if(delta<0&&p[field][half]<=0)return;
 p[field][half]+=delta;
 if(field==="goals")data.score.ours[half]+=delta;
 persist();
 render();
}

function ownGoal(delta){
 advance();
 const h=data.half;
 if(delta<0&&data.score.unassigned[h]<=0)return;
 data.score.unassigned[h]+=delta;
 data.score.ours[h]+=delta;
 persist();
 render();
}

function rivalGoal(delta){
 advance();
 const h=data.half;
 data.score.theirs[h]=Math.max(0,data.score.theirs[h]+delta);
 persist();
 render();
}

function btn(label,cls,fn){
 const b=document.createElement("button");
 b.type="button";
 b.textContent=label;
 b.className=cls;
 b.onclick=fn;
 return b;
}

function render(){
 if(!data)return;
 const g=game(currentId);
 const playing=data.phase==="playing";

 $("matches").value=currentId;
 $("deleteTraining").hidden=!isTraining();
 $("matchInfo").textContent=isTraining()
  ?g.date+" · Tiempo corrido · "+(g.minutes||g.minutos||30)+" min"
  :g.date+" · Liga · 25 + 25 min";

 if(document.activeElement!==$("rival")){
  $("rival").value=data.rival;
 }
 $("rivalTitle").textContent=data.rival||"Rival";
 $("clock").textContent=mmss(
  (isTraining()?0:data.half*1500)+data.sec
 );

 $("start").hidden=!setup();
 $("finish").hidden=!playing;

 $("start").textContent=isTraining()?"Iniciar":
  data.phase==="break"?"Iniciar 2.ª":"Iniciar 1.ª";

 $("finish").textContent=isTraining()?"Finalizar":
  data.half===0?"Terminar 1.ª":"Finalizar";

 $("phase").textContent=playing
  ?isTraining()?"ENTRENO · TIEMPO CORRIDO":
   data.half===0?"1.ª PARTE":"2.ª PARTE"
  :({
   pre1:"PREPARAR",
   break:"DESCANSO",
   done:"FINALIZADO"
  })[data.phase];

 $("hint").textContent=setup()?"Selecciona 8 titulares":
  playing?"Sacar y después meter":"Reloj parado";

 $("ours").textContent=sum(data.score.ours);
 $("theirs").textContent=sum(data.score.theirs);
 $("partials").textContent=isTraining()?"Tiempo único":
  "1.ª "+data.score.ours[0]+"-"+data.score.theirs[0]+
  " · 2.ª "+data.score.ours[1]+"-"+data.score.theirs[1];

 $("playersTitle").textContent=setup()
  ?"Titulares: "+data.selected.length+"/8"
  :"En campo: "+data.players.filter(p=>p.on).length+"/8";

 const area=$("players");
 area.replaceChildren();

 for(const p of data.players){
  const chosen=data.selected.includes(p.number);
  const card=document.createElement("div");
  card.className="player"+
   (playing&&p.on?" on":"")+
   (setup()&&chosen?" chosen":"");

  const head=document.createElement("div");
  head.className="player-head";
  const title=document.createElement("h3");
  title.textContent=p.number+" · "+p.name;
  const dot=document.createElement("span");
  dot.className="dot";
  dot.textContent=setup()
   ?chosen?"✓":""
   :playing?p.on?"🟢":"⚪":"";
  head.append(title,dot);

  const timer=document.createElement("div");
  timer.className="ptimer";
  timer.textContent=mmss(sum(p.time));

  const action=btn(
   setup()?chosen?"✓ TITULAR":"SELECCIONAR":
   playing?p.on?"SACAR":"METER":"FINALIZADO",
   "action "+(p.on?"green":"grey"),
   ()=>toggle(p.number)
  );
  action.disabled=data.phase==="done";

  const stats=document.createElement("div");
  stats.className="statsline";
  stats.textContent="⚽ "+sum(p.goals)+"   👟 "+sum(p.assists);

  const details=document.createElement("details");
  details.className="more";
  details.open=expandedPlayers.has(p.number);
  details.addEventListener("toggle",()=>{
   if(details.open)expandedPlayers.add(p.number);
   else expandedPlayers.delete(p.number);
  });

  const summary=document.createElement("summary");
  summary.textContent="⚽ Goles / 👟 Asistencias";
  const controls=document.createElement("div");
  controls.className="statbuttons";

  controls.append(
   btn("+ Gol","green",()=>stat(p.number,"goals",1)),
   btn("− Gol","red",()=>stat(p.number,"goals",-1)),
   btn("+ Asist.","",()=>stat(p.number,"assists",1)),
   btn("− Asist.","grey",()=>stat(p.number,"assists",-1))
  );

  details.append(summary,controls);
  card.append(head,timer,action,stats,details);
  area.append(card);
 }

 const tbody=$("statsTable");
 tbody.replaceChildren();

 for(const p of data.players){
  const tr=document.createElement("tr");
  if(playing&&p.on)tr.style.background="#def7e8";
  for(const v of [
   p.number+" · "+p.name,
   mmss(p.time[0]),
   isTraining()?"—":mmss(p.time[1]),
   mmss(sum(p.time)),
   sum(p.goals),sum(p.assists)
  ]){
   const td=document.createElement("td");
   td.textContent=v;
   tr.append(td);
  }
  tbody.append(tr);
 }
}

function exportCSV(){
 advance();
 localSave();
 const rows=[
  ["Dorsal","Jugador","Primera / Única","Segunda","Total","Goles","Asistencias"]
 ];
 for(const p of data.players){
  rows.push([
   p.number,p.name,mmss(p.time[0]),
   isTraining()?"":mmss(p.time[1]),
   mmss(sum(p.time)),sum(p.goals),sum(p.assists)
  ]);
 }
 rows.push(
  [],
  ["Partido",game(currentId).name],
  ["Rival",data.rival],
  ["Marcador",sum(data.score.ours)+"-"+sum(data.score.theirs)]
 );
 const csv="\uFEFF"+rows.map(r=>
  r.map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(";")
 ).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{
  type:"text/csv;charset=utf-8"
 }));
 const a=document.createElement("a");
 a.href=url;
 a.download="SantaMarina_"+currentId+".csv";
 document.body.append(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}

async function deleteTraining(){
 if(!isTraining())return;
 if(!confirm("¿Eliminar este entrenamiento y sus estadísticas de Firebase?"))return;

 const deleted=currentId;
 const remaining=store.entrenamientos.filter(g=>g.id!==deleted);
 clearTimeout(saveTimer);
 saveTimer=null;
 if(unsub){unsub();unsub=null}
 await writeQueue;

 if(user&&db){
  try{
   const root=db.collection("entrenadores").doc(user.uid);
   await root.collection("partidos").doc(deleted).delete();
   await root.collection("config").doc("entrenamientos")
    .set({lista:remaining});
  }catch(e){
   alert("No se pudo borrar en Firebase: "+e.message);
   subscribe();
   return;
  }
 }

 delete store.partidos[deleted];
 store.entrenamientos=remaining;
 localStorage.setItem(KEY,JSON.stringify(store));
 data=null;
 await choose("j6");
 alert("Entrenamiento eliminado.");
}

/* BOTONES */
$("matches").onchange=e=>{
 if(e.target.value==="new"){
  $("trainingCreate").hidden=false;
  $("matches").value=currentId;
  return;
 }
 $("trainingCreate").hidden=true;
 choose(e.target.value);
};

$("cancelTraining").onclick=()=>{
 $("trainingCreate").hidden=true;
};

$("addTraining").onclick=async()=>{
 const date=$("trainDate").value;
 const name=$("trainName").value.trim();
 const minutes=Number($("trainMinutes").value);

 if(!date||!name||!Number.isFinite(minutes)||minutes<1||minutes>180){
  return alert("Indica la fecha, el nombre y la duración.");
 }

 const g={
  id:"entreno-"+Date.now(),
  name:"Entreno · "+name,
  date,
  rival:$("trainRival").value.trim()||name,
  type:"training",
  minutes
 };

 store.entrenamientos.push(g);
 localStorage.setItem(KEY,JSON.stringify(store));

 if(user&&db){
  try{
   await db.collection("entrenadores").doc(user.uid)
    .collection("config").doc("entrenamientos")
    .set({lista:store.entrenamientos});
  }catch(e){
   alert("Entreno local, error de sincronización: "+e.message);
  }
 }

 $("trainingCreate").hidden=true;
 await choose(g.id);
};

$("deleteTraining").onclick=deleteTraining;
$("rival").onchange=e=>{
 data.rival=e.target.value.trim();
 persist();
 render();
};
$("start").onclick=start;
$("finish").onclick=finish;
$("undo").onclick=undo;
$("ownPlus").onclick=()=>ownGoal(1);
$("ownMinus").onclick=()=>ownGoal(-1);
$("oppPlus").onclick=()=>rivalGoal(1);
$("oppMinus").onclick=()=>rivalGoal(-1);
$("export").onclick=exportCSV;
$("reset").onclick=()=>{
 if(!confirm("¿Borrar las estadísticas de este partido?"))return;
 data=fresh(game(currentId));
 history=[];
 persist();
 render();
};

/* FIREBASE */
const configured=Boolean(
 firebaseConfig.apiKey &&
 !firebaseConfig.apiKey.startsWith("PEGA_")
);

if(configured&&typeof firebase!=="undefined"){
 try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  $("sync").textContent="Firebase listo · Inicia sesión";

  $("signIn").onclick=()=>auth.signInWithEmailAndPassword(
   $("email").value,$("password").value
  ).catch(e=>alert(e.message));

  $("signUp").onclick=()=>auth.createUserWithEmailAndPassword(
   $("email").value,$("password").value
  ).catch(e=>alert(e.message));

  $("signOut").onclick=()=>auth.signOut();

  auth.onAuthStateChanged(async u=>{
   user=u;
   $("signOut").hidden=!u;
   $("signIn").hidden=!!u;
   $("signUp").hidden=!!u;

   if(!u){
    if(unsub){unsub();unsub=null}
    $("sync").textContent="Sesión cerrada · Modo local";
    return;
   }

   $("sync").textContent="Conectado: "+u.email;

   try{
    const snap=await db.collection("entrenadores")
     .doc(u.uid).collection("config")
     .doc("entrenamientos").get();

    if(snap.exists&&Array.isArray(snap.data().lista)){
     const remote=snap.data().lista;
     store.entrenamientos=[
      ...remote,
      ...store.entrenamientos.filter(local=>
       !remote.some(x=>x.id===local.id)
      )
     ];
     options();
    }
   }catch(e){
    $("sync").textContent="Error entrenos: "+e.message;
   }

   await choose(currentId);
  });

 }catch(e){
  $("sync").textContent="Error Firebase: "+e.message;
 }
}else{
 $("sync").textContent="Modo local · Configura apiKey";
}

/* INICIALIZACIÓN */
options();
choose("j6");

setInterval(()=>{
 if(data&&data.phase==="playing"){
  advance();
  localSave();
  render();
 }
},1000);

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&data){
  advance();
  localSave();
  render();
 }
});
</script>
