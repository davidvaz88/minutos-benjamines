
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142948">
<title>Benxamín C - U.D. Santa Mariña</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#edf2f7;color:#172b43;
 font:14px system-ui,Arial,sans-serif
}
header{
 background:#142948;color:white;padding:8px;
 display:flex;align-items:center;justify-content:center;gap:10px
}
header img{width:42px;height:48px;object-fit:contain}
header h1{font-size:17px;margin:0}
header small{font-size:11px}
main{max-width:1150px;margin:auto;padding:7px}
.panel{
 background:white;border-radius:10px;padding:10px;
 margin-bottom:7px;box-shadow:0 1px 5px #0001
}
h2{font-size:16px;margin:3px 0 8px}
button{
 border:0;border-radius:8px;padding:9px 8px;
 background:#245aaa;color:white;font-weight:700;
 font-size:12px;cursor:pointer;touch-action:manipulation
}
button:disabled{opacity:.4}
.green{background:#168051}
.red{background:#b32f40}
.grey{background:#657386}
input,select{
 width:100%;max-width:100%;padding:9px;
 border:1px solid #cbd5e1;border-radius:8px;font-size:15px
}
label{display:block;margin:7px 0;font-weight:600}
.buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.muted{font-size:11px;color:#526479;margin:5px 0}
.center{text-align:center}
.clock{
 font-size:39px;font-weight:850;text-align:center;
 font-variant-numeric:tabular-nums
}
.topbar{display:grid;grid-template-columns:1fr;gap:7px}
.topbar .panel{margin:0}
.score{
 display:grid;grid-template-columns:1fr auto 1fr;
 gap:7px;align-items:center;text-align:center
}
.score div{background:#eef2f7;padding:7px;border-radius:9px}
.score strong{display:block;font-size:32px}
.players{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:6px
}
.player{
 min-width:0;background:#edf2f8;
 border:2px solid transparent;border-radius:9px;padding:7px
}
.player.on{background:#dcf7e7;border-color:#168051}
.player.selected{background:#dceafe;border-color:#245aaa}
.player h3{font-size:14px;margin:0;min-height:18px}
.timer{
 text-align:center;font-size:25px;font-weight:850;
 font-variant-numeric:tabular-nums;margin:5px 0
}
.player.on .timer{color:#168051}
.player .status{text-align:center;font-size:11px;min-height:15px}
.wide{width:100%;margin:6px 0}
.twobuttons{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.twobuttons button{padding:8px 2px;font-size:11px}
.stat{text-align:center;font-size:12px;margin:7px 0 4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{
 padding:8px 4px;border-bottom:1px solid #dbe2e9;
 text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums
}
th:first-child,td:first-child{text-align:left}
[hidden]{display:none!important}
summary{cursor:pointer;font-weight:750}
.line{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:650px){
 .topbar{grid-template-columns:1fr 1fr}
 .players{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<img src="escudo-ud-santa-marina.png"
 alt="Escudo Santa Mariña"
 onerror="this.style.display='none'">
<div>
<h1>Benxamín C - U.D. Santa Mariña</h1>
<small>Minutos · Goles · Asistencias</small>
</div>
</header>

<main>

<details class="panel">
<summary>☁️ <span id="sync">Modo local</span></summary>
<label>Correo</label>
<input id="email" type="email">
<label>Contraseña</label>
<input id="password" type="password">
<div class="buttons">
<button id="signIn">Entrar</button>
<button id="signUp" class="grey">Crear cuenta</button>
<button id="signOut" class="red" hidden>Cerrar sesión</button>
</div>
</details>

<section class="panel">
<h2>📅 Partido / Entrenamiento</h2>
<select id="matches"></select>

<div id="trainingCreate" hidden>
<label>Fecha</label>
<input id="trainDate" type="date">
<label>Nombre</label>
<input id="trainName" placeholder="Entreno del jueves">
<label>Duración en minutos</label>
<input id="trainMinutes" type="number" value="30" min="1" max="180">
<label>Rival / Equipos</label>
<input id="trainRival" placeholder="Rojo vs Azul">
<button id="addTraining" class="green">Crear entrenamiento</button>
</div>

<p id="matchInfo" class="muted"></p>
<button id="deleteTraining" class="red" hidden>
🗑 Eliminar este partidillo
</button>

<label>Rival
<input id="rival" placeholder="Nombre del rival">
</label>
</section>

<div class="topbar">

<section class="panel">
<div id="clock" class="clock">00:00</div>
<h3 id="phase" class="center">PREPARAR PARTIDO</h3>
<p id="hint" class="muted center"></p>
<div class="buttons">
<button id="start" class="green">Iniciar</button>
<button id="finish" class="red" hidden>Terminar</button>
<button id="undo" class="grey">Deshacer cambio</button>
</div>
</section>

<section class="panel">
<h2>⚽ Marcador</h2>
<div class="score">
<div>Santa Mariña<strong id="ours">0</strong></div>
<b>—</b>
<div><span id="rivalTitle">Rival</span>
<strong id="theirs">0</strong></div>
</div>
<p id="partials" class="muted center"></p>
<div class="buttons">
<button id="ownPlus" class="green">+ Gol propio</button>
<button id="ownMinus" class="red">− Gol propio</button>
<button id="oppPlus">+ Gol rival</button>
<button id="oppMinus" class="grey">− Gol rival</button>
</div>
</section>

</div>

<section class="panel">
<h2 id="playersTitle">Titulares: 0/8</h2>
<div class="players" id="players"></div>
</section>

<details class="panel">
<summary>📊 Estadísticas y Excel</summary>
<div class="scroll">
<table>
<thead>
<tr>
<th>Jugador</th>
<th>1.ª / Única</th>
<th>2.ª</th>
<th>Total</th>
<th>⚽</th>
<th>👟</th>
</tr>
</thead>
<tbody id="summary"></tbody>
</table>
</div>
<div class="buttons">
<button id="export" class="green">Exportar CSV</button>
<button id="reset" class="red">Reiniciar partido</button>
</div>
</details>

</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

/* FIREBASE: PEGA TU API KEY CORRECTA */
const firebaseConfig = {
 apiKey: "AIzaSyAY-ntSe4jskS8wkXdWDYjLSseeFVO2tsM",
 authDomain:"benxamin-c-santa-marina.firebaseapp.com",
 projectId:"benxamin-c-santa-marina",
 storageBucket:"benxamin-c-santa-marina.firebasestorage.app",
 messagingSenderId:"596374814925",
 appId:"1:596374814925:web:6c2cbac5f1a360a0f9a984"
};

const PEOPLE=[
 [1,"Mauro"],[3,"Javi"],[4,"Elías"],[5,"Brais"],
 [6,"Xabi"],[7,"Roque"],[8,"Leo Estévez"],
 [9,"Thiago"],[10,"Enzo"],[11,"Angelo"],
 [12,"Xes"],[14,"Leo Mendes"]
];

const GAMES=[
 {id:"j6",name:"Jornada 6 · CF San Esteban",
  date:"08/11/2026",rival:"CF San Esteban",type:"league"},
 {id:"j7",name:"Jornada 7 · Moledo C.F. B",
  date:"15/11/2026",rival:"Moledo C.F. B",type:"league"},
 {id:"j8",name:"Jornada 8 · C.D. Nieto A",
  date:"22/11/2026",rival:"C.D. Nieto A",type:"league"},
 {id:"j9",name:"Jornada 9 · Club Peñasco A",
  date:"29/11/2026",rival:"Club Peñasco A",type:"league"}
];

const KEY="santamarina_firebase_v1";
const MAX=8;
const $=id=>document.getElementById(id);
const sum=x=>x[0]+x[1];

let store={entrenamientos:[],partidos:{}};
let id="j6",data,history=[];
let auth=null,db=null,user=null,unsubscribe=null;
let saveTimer=null,savePromise=Promise.resolve();
let pending=false,cloudLoading=false;
let activePage=true,deletedIds=new Set();

try{
 const s=JSON.parse(localStorage.getItem(KEY)||"null");
 if(s&&s.partidos)store=s;
}catch(e){console.warn(e)}

function game(gid){
 return [...GAMES,...store.entrenamientos]
  .find(g=>g.id===gid);
}
function training(){
 return game(id)?.type==="training" ||
        game(id)?.tipo==="entreno";
}
function duration(){
 return training()
  ?Math.max(60,Number(game(id).minutes||game(id).minutos||30)*60)
  :1500;
}
function fresh(g){
 return {
  phase:"pre1",half:0,sec:0,stamp:null,
  selected:[],rival:g.rival||"",
  score:{ours:[0,0],theirs:[0,0],unassigned:[0,0]},
  players:PEOPLE.map(([number,name])=>({
   number,name,on:false,time:[0,0],
   goals:[0,0],assists:[0,0]
  }))
 };
}
function localSave(){
 store.partidos[id]=data;
 try{
  localStorage.setItem(KEY,JSON.stringify(store));
 }catch(e){console.warn(e)}
}
function cloudRef(gid){
 return db.collection("entrenadores").doc(user.uid)
  .collection("partidos").doc(gid);
}
function persist(){
 localSave();
 if(!user||!db||cloudLoading)return;
 pending=true;
 clearTimeout(saveTimer);
 const current=id;
 const copy=JSON.parse(JSON.stringify(data));
 saveTimer=setTimeout(()=>{
  const ref=cloudRef(current);
  savePromise=savePromise.then(()=>{
   if(deletedIds.has(current))return;
   return ref.set({
    data:copy,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
  }).then(()=>{
   pending=false;
   $("sync").textContent="Sincronizado";
  }).catch(e=>{
   pending=false;
   $("sync").textContent="Error guardando: "+e.message;
  });
 },350);
}
function mmss(s){
 const n=Math.floor(Math.max(0,s));
 return String(Math.floor(n/60)).padStart(2,"0")
  +":"+String(n%60).padStart(2,"0");
}
function setup(){
 return data.phase==="pre1"||data.phase==="break";
}
function finishHalf(){
 data.stamp=null;
 data.players.forEach(p=>p.on=false);
 data.selected=[];
 data.phase=training()||data.half===1?"done":"break";
 history=[];
 persist();
}
function advance(){
 if(!data||data.phase!=="playing")return;
 const now=Date.now();
 const diff=Math.max(0,(now-(data.stamp??now))/1000);
 const step=Math.min(diff,Math.max(0,duration()-data.sec));
 data.sec+=step;
 data.stamp=now;
 data.players.forEach(p=>{
  if(p.on)p.time[data.half]+=step;
 });
 if(data.sec>=duration())finishHalf();
}
function options(){
 const select=$("matches");
 select.replaceChildren();
 [...GAMES,...store.entrenamientos].forEach(g=>{
  select.add(new Option(
   g.name||g.nombre,g.id
  ));
 });
 select.add(new Option(
  "＋ Crear partidillo de entrenamiento","new"
 ));
 select.value=id;
}
function subscribe(){
 if(unsubscribe){unsubscribe();unsubscribe=null}
 if(!user||!db)return;
 const current=id;
 unsubscribe=cloudRef(current).onSnapshot(snap=>{
  if(id!==current||!snap.exists||pending||cloudLoading)return;
  const remote=snap.data().data;
  if(!remote||!Array.isArray(remote.players))return;
  data=remote;
  advance();
  localSave();
  render();
 },e=>$("sync").textContent="Error: "+e.message);
}
async function choose(gid){
 if(data){
  advance();
  localSave();
 }
 if(unsubscribe){unsubscribe();unsubscribe=null}
 clearTimeout(saveTimer);
 if(user)await savePromise;
 id=gid;
 const g=game(id);
 if(!g)return;
 data=store.partidos[id]||fresh(g);
 history=[];
 if(user&&db){
  cloudLoading=true;
  try{
   const snap=await cloudRef(id).get();
   if(snap.exists&&snap.data().data){
    data=snap.data().data;
   }else{
    await cloudRef(id).set({data:data});
   }
  }catch(e){
   $("sync").textContent="Error cargando: "+e.message;
  }finally{cloudLoading=false}
 }
 advance();
 localSave();
 options();
 subscribe();
 render();
}
function person(n){
 return data.players.find(p=>p.number===n);
}
function toggle(n){
 advance();
 const p=person(n);
 if(setup()){
  const k=data.selected.indexOf(n);
  if(k>=0)data.selected.splice(k,1);
  else if(data.selected.length<MAX)data.selected.push(n);
  else return alert("Selecciona solo 8 titulares.");
 }else if(data.phase==="playing"){
  if(!p.on&&data.players.filter(x=>x.on).length>=MAX){
   return alert("Primero saca a un jugador.");
  }
  history.push(data.players.map(x=>x.on));
  p.on=!p.on;
 }else return;
 persist();render();
}
function start(){
 advance();
 if(!setup())return;
 if(data.selected.length!==8){
  return alert("Selecciona exactamente 8 titulares.");
 }
 data.half=data.phase==="break"?1:0;
 data.sec=0;
 data.stamp=Date.now();
 data.phase="playing";
 data.players.forEach(p=>p.on=data.selected.includes(p.number));
 data.selected=[];
 history=[];
 persist();render();
}
function finish(){
 advance();
 if(data.phase==="playing")finishHalf();
 render();
}
function undo(){
 advance();
 if(data.phase!=="playing"||!history.length){
  return alert("No hay cambios que deshacer.");
 }
 const old=history.pop();
 data.players.forEach((p,i)=>p.on=old[i]);
 persist();render();
}
function stat(n,field,delta){
 advance();
 const p=person(n),h=data.half;
 if(delta<0&&p[field][h]<=0)return;
 p[field][h]+=delta;
 if(field==="goals")data.score.ours[h]+=delta;
 persist();render();
}
function unassigned(delta){
 advance();
 const h=data.half;
 if(delta<0&&data.score.unassigned[h]===0)return;
 data.score.unassigned[h]+=delta;
 data.score.ours[h]+=delta;
 persist();render();
}
function opponent(delta){
 advance();
 const h=data.half;
 data.score.theirs[h]=Math.max(0,data.score.theirs[h]+delta);
 persist();render();
}
function button(text,cls,fn){
 const b=document.createElement("button");
 b.textContent=text;
 b.className=cls;
 b.type="button";
 b.onclick=fn;
 return b;
}
function render(){
 const g=game(id),playing=data.phase==="playing";
 $("matches").value=id;
 $("deleteTraining").hidden=!training();
 $("matchInfo").textContent=training()
  ?g.date+" · Tiempo corrido · "+(g.minutes||g.minutos)+" min"
  :g.date+" · Liga · 25 + 25 min";
 if(document.activeElement!==$("rival"))
  $("rival").value=data.rival;
 $("rivalTitle").textContent=data.rival||"Rival";
 $("clock").textContent=mmss(
  training()?data.sec:data.half*1500+data.sec
 );
 $("start").hidden=!setup();
 $("finish").hidden=!playing;
 $("start").textContent=training()
  ?"Iniciar partidillo"
  :data.phase==="break"?"Iniciar segunda parte":"Iniciar primera parte";
 $("finish").textContent=training()
  ?"Finalizar partidillo"
  :data.half===0?"Terminar 1.ª parte":"Finalizar partido";
 const phase={
  pre1:training()?"PREPARAR ENTRENAMIENTO":"PREPARAR PRIMERA PARTE",
  break:"DESCANSO · RELOJ PARADO",
  done:"PARTIDO FINALIZADO"
 };
 $("phase").textContent=data.phase==="playing"
  ?training()?"ENTRENAMIENTO · TIEMPO CORRIDO":
   data.half===0?"PRIMERA PARTE":"SEGUNDA PARTE"
  :phase[data.phase];
 $("hint").textContent=setup()
  ?"Selecciona 8 titulares."
  :playing?"Toca SACAR y después METER.":"Tiempo parado.";
 $("ours").textContent=sum(data.score.ours);
 $("theirs").textContent=sum(data.score.theirs);
 $("partials").textContent=training()
  ?"Un único tiempo"
  :"1.ª: "+data.score.ours[0]+"-"+data.score.theirs[0]+
   " · 2.ª: "+data.score.ours[1]+"-"+data.score.theirs[1];
 $("playersTitle").textContent=setup()
  ?"Titulares: "+data.selected.length+"/8"
  :"En campo: "+data.players.filter(p=>p.on).length+"/8";

 const area=$("players");
 area.replaceChildren();
 for(const p of data.players){
  const chosen=data.selected.includes(p.number);
  const card=document.createElement("div");
  card.className="player"+
   (playing&&p.on?" on":"")+
   (setup()&&chosen?" selected":"");
  const title=document.createElement("h3");
  title.textContent=p.number+" · "+p.name;
  const timer=document.createElement("div");
  timer.className="timer";
  timer.textContent=mmss(sum(p.time));
  const status=document.createElement("div");
  status.className="status";
  status.textContent=setup()
   ?chosen?"✓ TITULAR":"Seleccionar"
   :playing?p.on?"🟢 EN CAMPO":"⚪ BANQUILLO":"FINALIZADO";
  const toggleBtn=button(
   setup()?chosen?"✓ TITULAR":"SELECCIONAR":
   playing?p.on?"SACAR":"METER":"FINALIZADO",
   "wide "+(p.on?"green":"grey"),()=>toggle(p.number)
  );
  toggleBtn.disabled=data.phase==="done";

  const goals=document.createElement("p");
  goals.className="stat";
  goals.textContent="⚽ Goles: "+sum(p.goals);
  const gb=document.createElement("div");
  gb.className="twobuttons";
  gb.append(
   button("+ Gol","green",()=>stat(p.number,"goals",1)),
   button("− Gol","red",()=>stat(p.number,"goals",-1))
  );

  const assists=document.createElement("p");
  assists.className="stat";
  assists.textContent="👟 Asist.: "+sum(p.assists);
  const ab=document.createElement("div");
  ab.className="twobuttons";
  ab.append(
   button("+ Asist.","",()=>stat(p.number,"assists",1)),
   button("− Asist.","grey",()=>stat(p.number,"assists",-1))
  );
  card.append(title,timer,status,toggleBtn,goals,gb,assists,ab);
  area.append(card);
 }

 const tbody=$("summary");
 tbody.replaceChildren();
 for(const p of data.players){
  const tr=document.createElement("tr");
  if(playing&&p.on)tr.style.background="#dcf7e7";
  [
   p.number+" · "+p.name,
   mmss(p.time[0]),
   training()?"—":mmss(p.time[1]),
   mmss(sum(p.time)),
   sum(p.goals),
   sum(p.assists)
  ].forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v;
   tr.append(td);
  });
  tbody.append(tr);
 }
}
function exportCSV(){
 advance();
 localSave();
 const g=game(id);
 const rows=[[
  "Dorsal","Jugador","Primera / Única",
  "Segunda","Total","Goles","Asistencias"
 ]];
 data.players.forEach(p=>rows.push([
  p.number,p.name,mmss(p.time[0]),
  training()?"":mmss(p.time[1]),
  mmss(sum(p.time)),sum(p.goals),sum(p.assists)
 ]));
 rows.push(
  [],
  ["Partido",g.name||g.nombre],
  ["Fecha",g.date],
  ["Rival",data.rival],
  ["Marcador",sum(data.score.ours)+" - "+sum(data.score.theirs)]
 );
 const csv="\uFEFF"+rows.map(r=>
  r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(";")
 ).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{
  type:"text/csv;charset=utf-8"
 }));
 const a=document.createElement("a");
 a.href=url;
 a.download="SantaMarina_"+id+".csv";
 document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}

async function deleteTraining(){
 const g=game(id);
 if(!training())return;
 if(!confirm(
  "¿Eliminar definitivamente este entrenamiento y sus estadísticas?"
 ))return;

 const oldId=id;
 clearTimeout(saveTimer);
 deletedIds.add(oldId);
 if(unsubscribe){unsubscribe();unsubscribe=null}
 await savePromise;

 const remaining=store.entrenamientos.filter(x=>x.id!==oldId);

 if(user&&db){
  try{
   const base=db.collection("entrenadores").doc(user.uid);
   await base.collection("partidos").doc(oldId).delete();
   await base.collection("config").doc("entrenamientos")
    .set({lista:remaining});
  }catch(e){
   deletedIds.delete(oldId);
   subscribe();
   alert("Error eliminando en Firebase: "+e.message);
   return;
  }
 }
 delete store.partidos[oldId];
 store.entrenamientos=remaining;
 data=null;
 try{
  localStorage.setItem(KEY,JSON.stringify(store));
 }catch(e){}
 await choose("j6");
 $("trainingCreate").hidden=true;
 alert("Entrenamiento eliminado.");
}

$("deleteTraining").onclick=deleteTraining;

$("matches").onchange=e=>{
 if(e.target.value==="new"){
  $("trainingCreate").hidden=false;
  return;
 }
 $("trainingCreate").hidden=true;
 choose(e.target.value);
};

$("addTraining").onclick=async()=>{
 const date=$("trainDate").value;
 const name=$("trainName").value.trim();
 const minutes=Number($("trainMinutes").value);
 if(!date||!name||minutes<1||minutes>180){
  return alert("Indica fecha, nombre y duración válida.");
 }
 const g={
  id:"entreno-"+Date.now(),
  name:"Entreno · "+name,
  date,
  rival:$("trainRival").value.trim()||name,
  type:"training",
  minutes
 };
 store.entrenamientos.push(g);
 localSave();
 if(user&&db){
  try{
   await db.collection("entrenadores").doc(user.uid)
    .collection("config").doc("entrenamientos")
    .set({lista:store.entrenamientos});
  }catch(e){
   alert("Creado localmente, pero falló la sincronización.");
  }
 }
 $("trainingCreate").hidden=true;
 await choose(g.id);
};

$("rival").onchange=e=>{
 data.rival=e.target.value.trim();
 persist();render();
};
$("start").onclick=start;
$("finish").onclick=finish;
$("undo").onclick=undo;
$("ownPlus").onclick=()=>unassigned(1);
$("ownMinus").onclick=()=>unassigned(-1);
$("oppPlus").onclick=()=>opponent(1);
$("oppMinus").onclick=()=>opponent(-1);
$("export").onclick=exportCSV;
$("reset").onclick=()=>{
 if(!confirm("¿Borrar las estadísticas de este partido?"))return;
 data=fresh(game(id));history=[];
 persist();render();
};

/* FIREBASE */
const configured=!!(
 firebaseConfig.apiKey &&
 !firebaseConfig.apiKey.startsWith("PEGA_") &&
 firebaseConfig.authDomain &&
 firebaseConfig.projectId
);

if(configured&&typeof firebase!=="undefined"){
 try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  $("sync").textContent="Firebase preparado";

  $("signIn").onclick=()=>auth.signInWithEmailAndPassword(
   $("email").value,$("password").value
  ).catch(e=>alert(e.message));

  $("signUp").onclick=()=>auth.createUserWithEmailAndPassword(
   $("email").value,$("password").value
  ).catch(e=>alert(e.message));

  $("signOut").onclick=()=>auth.signOut();

  auth.onAuthStateChanged(async u=>{
   user=u;
   $("signOut").hidden=!u;
   $("signIn").hidden=!!u;
   $("signUp").hidden=!!u;

   if(!u){
    $("sync").textContent="Modo local";
    if(unsubscribe){unsubscribe();unsubscribe=null}
    return;
   }

   $("sync").textContent="Firebase conectado";
   cloudLoading=true;
   try{
    const cfg=await db.collection("entrenadores").doc(u.uid)
     .collection("config").doc("entrenamientos").get();
    if(cfg.exists&&Array.isArray(cfg.data().lista)){
     store.entrenamientos=cfg.data().lista;
     options();
    }
   }catch(e){
    $("sync").textContent="Error: "+e.message;
   }finally{
    cloudLoading=false;
   }
   await choose(id);
  });
 }catch(e){
  $("sync").textContent="Error Firebase: "+e.message;
 }
}else{
 $("sync").textContent="Modo local · Configura Firebase";
}

options();
choose("j6");

setInterval(()=>{
 if(data&&data.phase==="playing"){
  advance();
  localSave();
  render();
 }
},1000);

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&data){
  advance();
  localSave();
  render();
 }
});
</script>
</body>
</html>
