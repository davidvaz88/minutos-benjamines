
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243a">
<title>Minutos Benjamines</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #182638;
  background: #edf2f7;
}
header {
  background: #10243a;
  color: white;
  padding: 18px;
  text-align: center;
}
h1 { font-size: 23px; margin: 0; }
main { max-width: 900px; margin: auto; padding: 12px; }
.panel {
  background: white;
  border-radius: 13px;
  padding: 15px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px #00000010;
}
.reloj {
  font-size: 52px;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.estado { text-align: center; font-weight: bold; }
.ayuda { color: #536579; font-size: 14px; }
.botones { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  border: 0;
  border-radius: 9px;
  padding: 11px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: #1766d1;
  touch-action: manipulation;
}
button:disabled { opacity: .4; cursor: default; }
button.verde { background: #168050; }
button.rojo { background: #bd3542; }
button.gris { background: #607184; }
button.naranja { background: #b16b08; }
.jugadores {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.jugador {
  background: #e9eef5;
  border-radius: 12px;
  padding: 11px;
  border: 2px solid transparent;
  min-width: 0;
}
.jugador.campo {
  background: #dcf8e6;
  border-color: #168050;
}
.jugador.elegido {
  background: #dceaff;
  border-color: #1766d1;
}
.nombre { font-size: 17px; font-weight: bold; }
.datos { font-size: 13px; margin: 8px 0; }
.accion-jugador {
  width: 100%;
  margin: 4px 0;
}
.marcadores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.marcadores button { font-size: 13px; padding: 9px 2px; }
.contador {
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  padding: 6px 0;
}
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 4px; border-bottom: 1px solid #ddd; }
td:not(:first-child), th:not(:first-child) { text-align: right; }
.tabla-scroll { overflow-x: auto; }
@media(min-width: 700px) {
  .jugadores { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header>
  <h1>⚽ Minutos Benjamines</h1>
</header>

<main>
<section class="panel">
  <div id="reloj" class="reloj">00:00</div>
  <p id="estado" class="estado">Preparar primera parte</p>
  <p id="ayuda" class="ayuda"></p>
  <div class="botones">
    <button id="iniciar" onclick="iniciarParte()">
      Iniciar primera parte
    </button>
    <button id="terminar" class="rojo"
      onclick="terminarParte()" style="display:none">
      Terminar primera parte
    </button>
    <button class="gris" onclick="deshacerCambio()">
      Deshacer último cambio
    </button>
  </div>
</section>

<section class="panel">
  <h2 id="tituloJugadores">Titulares: 0/8</h2>
  <div id="jugadores" class="jugadores"></div>
</section>

<section class="panel">
  <h2>Estadísticas del partido</h2>
  <div class="tabla-scroll">
    <table>
      <thead>
        <tr>
          <th>Jugador</th>
          <th>1.ª</th>
          <th>2.ª</th>
          <th>Total</th>
          <th>⚽</th>
          <th>👟</th>
        </tr>
      </thead>
      <tbody id="resumen"></tbody>
    </table>
  </div>
  <br>
  <div class="botones">
    <button class="verde" onclick="exportarCSV()">
      Exportar Excel (CSV)
    </button>
    <button class="rojo" onclick="nuevoPartido()">
      Nuevo partido
    </button>
  </div>
  <p class="ayuda">
    Los datos se guardan automáticamente en este navegador.
    Exporta el partido antes de empezar uno nuevo.
  </p>
</section>
</main>

<script>
"use strict";

const PLANTILLA = [
  [1, "Mauro"],
  [3, "Javi"],
  [4, "Elías"],
  [5, "Brais"],
  [6, "Xabi"],
  [7, "Roque"],
  [8, "Leo Estévez"],
  [9, "Thiago"],
  [10, "Enzo"],
  [11, "Angelo"],
  [12, "Xes"],
  [14, "Leo Mendes"]
];

const CLAVE = "minutos_benjamines_goles_v1";
const DURACION = 25 * 60;
const MAX_JUGADORES = 8;

function estadoInicial() {
  return {
    fase: "pre1",
    parte: 1,
    segundos: 0,
    ultimaActualizacion: null,
    seleccion: [],
    jugadores: PLANTILLA.map(([dorsal, nombre]) => ({
      dorsal,
      nombre,
      campo: false,
      tiempos: [0, 0],
      goles: 0,
      asistencias: 0
    }))
  };
}

let datos = estadoInicial();
let historial = [];

try {
  const guardado = localStorage.getItem(CLAVE);
  if (guardado) {
    const recuperado = JSON.parse(guardado);
    if (recuperado &&
        Array.isArray(recuperado.jugadores) &&
        recuperado.jugadores.length === PLANTILLA.length) {
      datos = recuperado;
    }
  }
} catch (error) {
  console.warn("Error recuperando datos", error);
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(datos));
  } catch (error) {
    console.warn("Error guardando datos", error);
  }
}

function copia() {
  return JSON.parse(JSON.stringify(datos));
}

function registrarCambio() {
  historial.push(datos.jugadores.map(j => j.campo));
  if (historial.length > 30) historial.shift();
}

function avanzarTiempo() {
  if (datos.fase !== "jugando") return;

  const ahora = Date.now();
  const anterior = datos.ultimaActualizacion || ahora;
  const delta = Math.max(0, (ahora - anterior) / 1000);
  const incremento = Math.min(
    delta,
    Math.max(0, DURACION - datos.segundos)
  );

  datos.segundos += incremento;
  datos.ultimaActualizacion = ahora;

  for (const j of datos.jugadores) {
    if (j.campo) {
      j.tiempos[datos.parte - 1] += incremento;
    }
  }

  if (datos.segundos >= DURACION) {
    finalizarParte();
  }
}

function relojFormato(segundos) {
  const s = Math.floor(segundos);
  const m = Math.floor(s / 60);
  return String(m).padStart(2, "0") + ":" +
         String(s % 60).padStart(2, "0");
}

function minutosFormato(segundos) {
  return (segundos / 60).toFixed(1).replace(".", ",");
}

function esPreparacion() {
  return datos.fase === "pre1" ||
         datos.fase === "descanso";
}

function jugadorPorDorsal(dorsal) {
  return datos.jugadores.find(j => j.dorsal === dorsal);
}

function tocarJugador(dorsal) {
  avanzarTiempo();

  const j = jugadorPorDorsal(dorsal);
  if (!j) return;

  if (esPreparacion()) {
    const indice = datos.seleccion.indexOf(dorsal);

    if (indice >= 0) {
      datos.seleccion.splice(indice, 1);
    } else {
      if (datos.seleccion.length >= MAX_JUGADORES) {
        alert("Solo puedes seleccionar 8 titulares.");
        return;
      }
      datos.seleccion.push(dorsal);
    }
  } else if (datos.fase === "jugando") {
    const enCampo = datos.jugadores.filter(x => x.campo).length;

    if (!j.campo && enCampo >= MAX_JUGADORES) {
      alert("Primero saca a un jugador del campo.");
      return;
    }

    registrarCambio();
    j.campo = !j.campo;
  } else {
    return;
  }

  guardar();
  pintar();
}

function iniciarParte() {
  avanzarTiempo();

  if (!esPreparacion()) return;

  if (datos.seleccion.length !== MAX_JUGADORES) {
    alert("Debes seleccionar exactamente 8 titulares.");
    return;
  }

  datos.parte = datos.fase === "pre1" ? 1 : 2;
  datos.segundos = 0;
  datos.fase = "jugando";
  datos.ultimaActualizacion = Date.now();

  for (const j of datos.jugadores) {
    j.campo = datos.seleccion.includes(j.dorsal);
  }

  datos.seleccion = [];
  historial = [];

  guardar();
  pintar();
}

function finalizarParte() {
  datos.ultimaActualizacion = null;

  for (const j of datos.jugadores) {
    j.campo = false;
  }

  datos.seleccion = [];
  datos.fase = datos.parte === 1 ? "descanso" : "final";
  historial = [];

  guardar();
}

function terminarParte() {
  if (datos.fase !== "jugando") return;

  avanzarTiempo();

  if (datos.fase === "jugando") {
    finalizarParte();
  }

  pintar();
}

function deshacerCambio() {
  avanzarTiempo();

  if (datos.fase !== "jugando" || historial.length === 0) {
    alert("No hay cambios que deshacer.");
    return;
  }

  const anterior = historial.pop();

  datos.jugadores.forEach((j, i) => {
    j.campo = anterior[i];
  });

  guardar();
  pintar();
}

function estadistica(dorsal, tipo, cantidad) {
  avanzarTiempo();

  const j = jugadorPorDorsal(dorsal);
  if (!j) return;

  if (tipo !== "goles" && tipo !== "asistencias") return;

  j[tipo] = Math.max(0, j[tipo] + cantidad);

  guardar();
  pintar();
}

function nuevoPartido() {
  if (!confirm(
    "¿Empezar un partido nuevo? Exporta antes las estadísticas."
  )) return;

  datos = estadoInicial();
  historial = [];
  guardar();
  pintar();
}

function exportarCSV() {
  avanzarTiempo();
  guardar();

  const filas = [
    ["Dorsal", "Nombre", "Primera parte (min)",
     "Segunda parte (min)", "Total (min)",
     "Goles", "Asistencias"]
  ];

  for (const j of datos.jugadores) {
    filas.push([
      j.dorsal,
      j.nombre,
      minutosFormato(j.tiempos[0]),
      minutosFormato(j.tiempos[1]),
      minutosFormato(j.tiempos[0] + j.tiempos[1]),
      j.goles,
      j.asistencias
    ]);
  }

  const contenido = "\uFEFF" +
    filas.map(f => f.join(";")).join("\r\n");

  const blob = new Blob([contenido], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "minutos-benjamines.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function crearBoton(texto, clase, funcion) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = clase;
  b.textContent = texto;
  b.onclick = funcion;
  return b;
}

function pintar() {
  const jugando = datos.fase === "jugando";
  const preparando = esPreparacion();

  const reloj = document.getElementById("reloj");
  const estado = document.getElementById("estado");
  const ayuda = document.getElementById("ayuda");
  const iniciar = document.getElementById("iniciar");
  const terminar = document.getElementById("terminar");

  const totalReloj = datos.parte === 2
    ? DURACION + datos.segundos
    : datos.segundos;

  reloj.textContent = relojFormato(totalReloj);

  iniciar.style.display = preparando ? "" : "none";
  terminar.style.display = jugando ? "" : "none";

  if (datos.fase === "pre1") {
    estado.textContent = "PREPARAR PRIMERA PARTE";
    iniciar.textContent = "Iniciar primera parte";
  } else if (datos.fase === "jugando") {
    estado.textContent = datos.parte === 1
      ? "PRIMERA PARTE EN JUEGO"
      : "SEGUNDA PARTE EN JUEGO";

    terminar.textContent = datos.parte === 1
      ? "Terminar primera parte"
      : "Finalizar partido";
  } else if (datos.fase === "descanso") {
    estado.textContent = "DESCANSO · RELOJ PARADO";
    iniciar.textContent = "Iniciar segunda parte";
  } else {
    estado.textContent = "PARTIDO FINALIZADO";
  }

  ayuda.textContent = preparando
    ? "Selecciona exactamente 8 titulares."
    : jugando
      ? "Toca para entrar o salir. Los goles y asistencias se anotan abajo."
      : "Partido terminado. Exporta las estadísticas.";

  const activos = datos.jugadores.filter(j => j.campo).length;

  document.getElementById("tituloJugadores").textContent =
    preparando
      ? "Titulares: " + datos.seleccion.length + "/8"
      : "En campo: " + activos + "/8";

  const contenedor = document.getElementById("jugadores");
  contenedor.replaceChildren();

  for (const j of datos.jugadores) {
    const elegido = datos.seleccion.includes(j.dorsal);

    const tarjeta = document.createElement("div");
    tarjeta.className = "jugador" +
      (jugando && j.campo ? " campo" : "") +
      (preparando && elegido ? " elegido" : "");

    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = j.dorsal + " · " + j.nombre;

    const datosJugador = document.createElement("div");
    datosJugador.className = "datos";
    datosJugador.textContent =
      minutosFormato(j.tiempos[0] + j.tiempos[1]) +
      " min · ⚽ " + j.goles +
      " · 👟 " + j.asistencias;

    const accion = crearBoton(
      preparando
        ? (elegido ? "✓ Titular" : "Seleccionar titular")
        : jugando
          ? (j.campo ? "🟢 SACAR" : "⚪ METER")
          : "Partido terminado",
      "accion-jugador " +
        (j.campo ? "verde" : "gris"),
      () => tocarJugador(j.dorsal)
    );

    accion.disabled = datos.fase === "final";

    const contadorGoles = document.createElement("div");
    contadorGoles.className = "contador";
    contadorGoles.textContent = "⚽ Goles: " + j.goles;

    const controlesGoles = document.createElement("div");
    controlesGoles.className = "marcadores";
    controlesGoles.append(
      crearBoton("+ Gol", "verde",
        () => estadistica(j.dorsal, "goles", 1)),
      crearBoton("- Gol", "rojo",
        () => estadistica(j.dorsal, "goles", -1))
    );

    const contadorAsistencias = document.createElement("div");
    contadorAsistencias.className = "contador";
    contadorAsistencias.textContent =
      "👟 Asistencias: " + j.asistencias;

    const controlesAsistencias = document.createElement("div");
    controlesAsistencias.className = "marcadores";
    controlesAsistencias.append(
      crearBoton("+ Asist.", "verde",
        () => estadistica(j.dorsal, "asistencias", 1)),
      crearBoton("- Asist.", "rojo",
        () => estadistica(j.dorsal, "asistencias", -1))
    );

    tarjeta.append(
      nombre,
      datosJugador,
      accion,
      contadorGoles,
      controlesGoles,
      contadorAsistencias,
      controlesAsistencias
    );

    contenedor.appendChild(tarjeta);
  }

  const resumen = document.getElementById("resumen");
  resumen.replaceChildren();

  for (const j of datos.jugadores) {
    const tr = document.createElement("tr");

    const valores = [
      j.dorsal + " · " + j.nombre,
      minutosFormato(j.tiempos[0]),
      minutosFormato(j.tiempos[1]),
      minutosFormato(j.tiempos[0] + j.tiempos[1]),
      j.goles,
      j.asistencias
    ];

    for (const valor of valores) {
      const td = document.createElement("td");
      td.textContent = valor;
      tr.appendChild(td);
    }

    resumen.appendChild(tr);
  }
}

// Actualizar tiempo al volver a abrir la web.
avanzarTiempo();
pintar();

setInterval(() => {
  if (datos.fase === "jugando") {
    avanzarTiempo();
    guardar();
    pintar();
  }
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    avanzarTiempo();
    guardar();
    pintar();
  }
});
</script>
</body>
</html>
